<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Slayer Tika | Dân Chơi</title>
<meta name="description" content="Developer · Gamer · Underground">
<meta property="og:title" content="Slayer Tika | Dân Chơi">
<meta property="og:description" content="Developer · Gamer · Underground">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tikaxp.github.io/Tika/assets/danchoi.gif">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07070b">

<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A4%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --accent:#39ff14;
  --accent2:#39ff14;
  --bg:#07070b;
  --text:#f2f0ee;
  --muted:#8f8d9b;
  --line:rgba(255,255,255,.09);
  --mx:50%;
  --my:0%;
  --cx:50vw;
  --cy:30vh;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  font:400 15px/1.5 Inter,system-ui,sans-serif;
  color:var(--text);
  background:#07070b;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

button {
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  cursor:pointer;
}

svg {display:block}

#bg,.aurora {display:none!important}

.grid {
  position:fixed;
  inset:0;
  z-index:-4;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask:radial-gradient(ellipse at center,#000 10%,transparent 75%);
  mask:radial-gradient(ellipse at center,#000 10%,transparent 75%);
}

#fx {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-3;
  pointer-events:none;
}

.spot {
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:radial-gradient(
    520px circle at var(--cx) var(--cy),
    rgba(57,255,20,.055),
    transparent 65%
  );
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    transparent 45%,
    rgba(0,0,0,.78) 100%
  );
}

/* SPLASH */

#splash {
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  background:
    radial-gradient(ellipse at 50% 45%,
      rgba(57,255,20,.10),
      transparent 55%),
    #050709;
  cursor:pointer;
  text-align:center;
  overflow:hidden;
  transition:opacity .8s,visibility .8s;
}

#splash::before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(57,255,20,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,255,20,.035) 1px,transparent 1px);
  background-size:45px 45px;
  -webkit-mask-image:radial-gradient(ellipse,#000,transparent 75%);
  mask-image:radial-gradient(ellipse,#000,transparent 75%);
}

#splash::after {
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  background:#39ff14;
  filter:blur(180px);
  opacity:.09;
  pointer-events:none;
}

#splash.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro {
  position:relative;
  z-index:2;
  width:min(500px,calc(100vw - 40px));
  padding:20px;
  border:1px solid rgba(57,255,20,.20);
  border-radius:24px;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.008)
  );
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:
    0 0 50px rgba(57,255,20,.055),
    inset 0 1px rgba(255,255,255,.07);
  animation:introIn 1.2s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes introIn {
  from {
    opacity:0;
    transform:translateY(25px) scale(.96);
    filter:blur(10px);
  }
  to {
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

.intro-top,
.intro-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#718477;
  font-size:10px;
  letter-spacing:2px;
}

.intro-top span:first-child {
  color:#39ff14;
}

.intro-live {
  color:#39ff14;
  animation:livePulse 2s infinite;
}

@keyframes livePulse {
  50% {opacity:.35}
}

.intro-center {
  text-align:center;
  padding:48px 0 40px;
}

.intro-orbit {
  position:relative;
  width:90px;
  height:90px;
  margin:0 auto 30px;
  display:grid;
  place-items:center;
  color:#39ff14;
  font-size:38px;
  text-shadow:0 0 25px #39ff14;
}

.orbit-ring {
  position:absolute;
  inset:0;
  border:1px solid rgba(57,255,20,.65);
  border-radius:50%;
  animation:spin 8s linear infinite;
}

.orbit-ring::before {
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#39ff14;
  box-shadow:0 0 15px #39ff14;
  top:8px;
  left:12px;
}

.ring-two {
  inset:-10px;
  border-style:dashed;
  opacity:.35;
  animation:spin 15s linear infinite reverse;
}

.intro-kicker {
  font-size:10px;
  letter-spacing:4px;
  color:#84918a;
  margin-bottom:12px;
}

#splash h2 {
  font:800 clamp(2.3rem,9vw,3.8rem)/1 Outfit,sans-serif;
  letter-spacing:.08em;
  padding:0;
  background:linear-gradient(180deg,#fff,#a9ff9b 65%,#39ff14);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.intro-line {
  width:100px;
  height:2px;
  margin:22px auto;
  background:linear-gradient(
    90deg,
    transparent,
    #39ff14,
    transparent
  );
  box-shadow:0 0 15px rgba(57,255,20,.6);
}

.intro-motto {
  color:#39ff14;
  font:700 17px Outfit,sans-serif;
  letter-spacing:4px;
}

.intro-sub {
  margin-top:12px;
  font-size:10px;
  letter-spacing:2px;
  color:#77847a;
}

/* ENTER BUTTON */

.intro-enter {
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  margin-top:38px;
  padding:17px;
  border:1px solid rgba(57,255,20,.3);
  border-radius:15px;
  background:rgba(57,255,20,.045);
  transition:.3s;
}

.intro-enter:hover {
  border-color:#39ff14;
  background:rgba(57,255,20,.11);
  box-shadow:0 0 30px rgba(57,255,20,.12);
  transform:translateY(-3px);
}

/* GREEN ICON BOX */

.enter-icon {
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  background:transparent;
  border:0;
  color:#39ff14;
}

.enter-icon svg {
  width:27px;
  height:27px;
  stroke:currentColor;
  filter:drop-shadow(0 0 5px rgba(57,255,20,.65));
}

.intro-enter:hover .enter-icon svg {
  filter:drop-shadow(0 0 9px #39ff14);
  transform:scale(1.08);
}

.intro-enter div {flex:1}

.intro-enter b {
  display:block;
  color:#fff;
  font:700 13px Outfit,sans-serif;
  letter-spacing:1px;
}

.intro-enter small {
  display:block;
  color:#84918a;
  font-size:9px;
  letter-spacing:1px;
  margin-top:4px;
}

.enter-arrow {
  color:#39ff14;
  font-size:22px;
  animation:arrowMove 1.2s ease-in-out infinite;
}

@keyframes arrowMove {
  50% {transform:translateX(5px)}
}

.intro-bottom {
  padding-top:15px;
  border-top:1px solid rgba(255,255,255,.07);
}

#splash.hide .intro {
  transform:scale(1.04);
  opacity:0;
  transition:.7s;
}

/* MAIN */

main {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px 16px;
}

body:not(.go) .card,
body:not(.go) .rv {
  opacity:0;
}

body.go .card {
  animation:cardIn 1.1s ease backwards;
}

body.go .rv {
  animation:fadeIn .8s cubic-bezier(.2,.7,.2,1) backwards;
  animation-delay:calc(var(--i)*70ms + 250ms);
}

@keyframes cardIn {
  from {opacity:0;filter:blur(10px)}
}

@keyframes fadeIn {
  from {
    opacity:0;
    transform:translateY(14px);
    filter:blur(6px);
  }
}

/* CARD */

.card {
  position:relative;
  isolation:isolate;
  width:min(460px,100%);
  padding:34px 26px 24px;
  border-radius:30px;
  text-align:center;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.012)
    ),
    rgba(10,10,15,.78);
  -webkit-backdrop-filter:blur(26px) saturate(140%);
  backdrop-filter:blur(26px) saturate(140%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 2px 4px rgba(0,0,0,.4),
    0 18px 55px rgba(0,0,0,.58),
    0 0 35px rgba(57,255,20,.055);
  will-change:transform;
  transition:box-shadow .35s ease;
}

.card::before {
  content:"";
  position:absolute;
  inset:0;
  padding:1.5px;
  border-radius:inherit;
  pointer-events:none;
  z-index:5;
  background:
    radial-gradient(
      280px circle at var(--mx) var(--my),
      #39ff14 0%,
      rgba(57,255,20,.78) 18%,
      transparent 66%
    ),
    linear-gradient(
      135deg,
      rgba(57,255,20,.52),
      rgba(57,255,20,.035) 42%,
      rgba(57,255,20,.28)
    );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:drop-shadow(0 0 5px rgba(57,255,20,.32));
}

.card::after {
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:-1;
  opacity:0;
  transition:opacity .35s;
  background:radial-gradient(
    440px circle at var(--mx) var(--my),
    rgba(57,255,20,.17),
    rgba(57,255,20,.045) 32%,
    transparent 68%
  );
}

.card:hover::after {opacity:1}

.card:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 18px 55px rgba(0,0,0,.58),
    0 0 24px rgba(57,255,20,.15),
    0 0 70px rgba(57,255,20,.075);
}

/* AVATAR */

.av {
  position:relative;
  width:124px;
  height:124px;
  margin:0 auto 16px;
}

.av::before {
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  background:conic-gradient(
    #39ff14,
    #b4ff9f,
    rgba(57,255,20,.12),
    #39ff14
  );
  animation:spin 6s linear infinite;
  box-shadow:0 0 16px rgba(57,255,20,.22);
}

.av::after {
  content:"";
  position:absolute;
  inset:-22px;
  border-radius:50%;
  z-index:-1;
  filter:blur(14px);
  background:radial-gradient(
    closest-side,
    rgba(57,255,20,.3),
    transparent
  );
  animation:breathe 4.5s ease-in-out infinite;
}

.av img {
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #0b0b10;
  background:#15151d;
}

@keyframes spin {
  to {transform:rotate(1turn)}
}

@keyframes breathe {
  50% {opacity:.55;transform:scale(1.08)}
}

.st {
  position:absolute;
  right:4px;
  bottom:4px;
  z-index:2;
  width:26px;
  height:26px;
  border-radius:50%;
  border:5px solid #0b0b10;
  background:#747f8d;
  color:#747f8d;
}

.st.online {
  background:#23a55a;
  color:#23a55a;
  animation:pulse 2.6s infinite;
}

.st.idle {
  background:#f0b232;
  color:#f0b232;
}

.st.dnd {
  background:#f23f43;
  color:#f23f43;
  animation:pulse 2.6s infinite;
}

@keyframes pulse {
  0% {box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}
  70%,100% {box-shadow:0 0 0 9px transparent}
}

/* IDENTITY */

.nm {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

h1 {
  font:700 2.1rem/1.15 Outfit,sans-serif;
  letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 30%,#a9a6b8);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.vf {width:22px;height:22px;flex:none}

.un {
  margin-top:2px;
  font-size:.88rem;
  color:var(--muted);
  transition:color .2s;
}

.un:hover {color:#39ff14}

/* BADGES */

.badges {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.badges .bdg {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:36px;
  height:36px;
  padding:0 8px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.08),
    rgba(255,255,255,.02)
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    0 4px 12px rgba(0,0,0,.25);
  transition:transform .25s,border-color .25s,box-shadow .25s;
  font-size:1.05rem;
  line-height:1;
}

.badges .bdg:hover {
  transform:translateY(-2px);
  border-color:rgba(57,255,20,.55);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 8px 20px rgba(0,0,0,.35),
    0 0 20px rgba(57,255,20,.2);
}

.badges .bdg img {
  width:24px;
  height:24px;
  object-fit:contain;
  border-radius:4px;
  display:block;
}

/* TYPED */

#typed {
  min-height:1.5em;
  margin-top:16px;
  font-weight:500;
  font-size:.95rem;
  color:#8cff78;
}

#typed::after {
  content:"";
  display:inline-block;
  width:1.5px;
  height:1em;
  margin-left:3px;
  vertical-align:-2px;
  background:currentColor;
  animation:blink 1s steps(1) infinite;
}

@keyframes blink {
  50% {opacity:0}
}

/* BIO */

.bio {
  position:relative;
  margin:22px auto 0;
  max-width:100%;
  padding:19px 17px 17px;
  border:1px solid rgba(57,255,20,.17);
  border-radius:17px;
  background:
    linear-gradient(
      135deg,
      rgba(57,255,20,.055),
      rgba(255,255,255,.015)
    );
  color:#b7c1b8;
  text-align:left;
  white-space:pre-line;
  font-size:.87rem;
  line-height:1.9;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

.bio::before {
  content:"ABOUT ME";
  display:block;
  color:#39ff14;
  font:700 10px Outfit,sans-serif;
  letter-spacing:2.5px;
  margin-bottom:11px;
}

.bio::after {
  content:"";
  position:absolute;
  top:18px;
  right:17px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#39ff14;
  box-shadow:0 0 12px #39ff14;
  animation:livePulse 2s infinite;
}

/* META */

.meta {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:18px;
}

.meta span {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border:1px solid var(--line);
  border-radius:99px;
  background:rgba(255,255,255,.04);
  font-size:.78rem;
  color:#cfccd8;
}

.meta svg {
  width:14px;
  height:14px;
  color:#8cff78;
}

/* DISCORD PRESENCE */

#presence {
  display:none;
  gap:12px;
  align-items:center;
  margin-top:18px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.04);
  text-align:left;
  font-size:.85rem;
}

#presence.on {display:flex}

#presence img {
  width:46px;
  height:46px;
  border-radius:11px;
  object-fit:cover;
  flex:none;
}

#presence div {min-width:0}

#presence b,
#presence small {
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#presence small {color:var(--muted)}

/* SOCIAL LINKS */

.links {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.links a:last-child:nth-child(odd) {
  grid-column:1/-1;
}

.links a {
  --b:var(--accent);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(255,255,255,.035);
  color:var(--text);
  text-decoration:none;
  text-align:left;
  transition:
    transform .25s,
    border-color .25s,
    background .25s,
    box-shadow .25s;
}

.links a::before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
  background:radial-gradient(
    130px circle at var(--lx,50%) var(--ly,50%),
    color-mix(in srgb,var(--b) 28%,transparent),
    transparent 70%
  );
}

.links a:hover,
.links a:focus-visible {
  outline:none;
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--b) 55%,transparent);
  background:color-mix(in srgb,var(--b) 9%,rgba(255,255,255,.03));
  box-shadow:0 10px 30px -12px color-mix(in srgb,var(--b) 70%,transparent);
}

.links a:hover::before {opacity:1}

.links a:active {transform:scale(.97)}

.ib {
  position:relative;
  flex:none;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(255,255,255,.06);
  transition:color .25s,background .25s;
}

.ib svg {width:19px;height:19px}

.links a:hover .ib {
  color:var(--b);
  background:color-mix(in srgb,var(--b) 16%,transparent);
}

.tx {min-width:0;position:relative}

.tx b {
  display:block;
  font-size:.88rem;
  font-weight:600;
  line-height:1.25;
}

.tx small {
  display:block;
  color:var(--muted);
  font-size:.75rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rip {
  position:absolute;
  width:10px;
  height:10px;
  margin:-5px;
  border-radius:50%;
  pointer-events:none;
  background:rgba(57,255,20,.55);
  animation:rip .6s ease-out forwards;
}

@keyframes rip {
  to {transform:scale(28);opacity:0}
}

/* MUSIC */

.player {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:20px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.04);
  font-size:.82rem;
}

.pb {
  flex:none;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#071006;
  background:linear-gradient(135deg,#39ff14,#b4ff9f);
  transition:transform .2s;
}

.pb:active {transform:scale(.9)}
.pb svg {width:16px;height:16px}

.t {
  flex:1;
  min-width:0;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#d8d5e0;
}

.eq {
  display:none;
  gap:2px;
  align-items:flex-end;
  height:14px;
}

.playing .eq {display:flex}

.eq i {
  width:3px;
  background:#39ff14;
  border-radius:2px;
  animation:eq 1s ease-in-out infinite;
}

.eq i:nth-child(1) {height:60%}
.eq i:nth-child(2) {height:100%;animation-delay:-.4s}
.eq i:nth-child(3) {height:40%;animation-delay:-.7s}

@keyframes eq {
  50% {transform:scaleY(.35)}
}

      if(m.op===1) {
        ws.send(JSON.stringify({
          op:2,
          d:{subscribe_to_id:CONFIG.discordId}
        }));

        hb = setInterval(()=>{
          ws.send(JSON.stringify({op:3}));
        },m.d.heartbeat_interval);
      }

      if(m.op===0) render(m.d);
    };

    ws.onclose = ()=>{
      clearInterval(hb);
      setTimeout(connect,5000);
    };

  } catch {}
})();

/* MOUSE LIGHT + 3D TILT */

if(FINE && !RM) {
  const c = $('card');

  const deep = [
    [c.querySelector('.av'),.9],
    [c.querySelector('.nm'),.5]
  ];

  const MAX = CONFIG.tiltMax??14;

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  let rx=0,ry=0,sc=1;
  let trx=0,try_=0,tsc=1;
  let run=false;

  function loop() {
    rx += (trx-rx)*.1;
    ry += (try_-ry)*.1;
    sc += (tsc-sc)*.1;

    c.style.transform =
      `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(4)})`;

    deep.forEach(([el,k])=>{
      if(el) {
        el.style.translate =
          `${(ry*k).toFixed(1)}px ${(-rx*k).toFixed(1)}px`;
      }
    });

    if(
      Math.abs(trx-rx)+
      Math.abs(try_-ry)+
      Math.abs(tsc-sc)>.002
    ) {
      requestAnimationFrame(loop);
    } else {
      run=false;
    }
  }

  const kick = ()=>{
    if(!run) {
      run=true;
      requestAnimationFrame(loop);
    }
  };

  document.addEventListener('pointermove',e=>{
    const r = c.getBoundingClientRect();

    root.setProperty('--cx',e.clientX+'px');
    root.setProperty('--cy',e.clientY+'px');

    c.style.setProperty('--mx',e.clientX-r.left+'px');
    c.style.setProperty('--my',e.clientY-r.top+'px');

    if(!CONFIG.tilt) return;

    const nx = clamp(
      (e.clientX-r.left-r.width/2)/(r.width*.65),
      -1,1
    );

    const ny = clamp(
      (e.clientY-r.top-r.height/2)/(r.height*.65),
      -1,1
    );

    const inside =
      e.clientX>r.left &&
      e.clientX<r.right &&
      e.clientY>r.top &&
      e.clientY<r.bottom;

    try_ = nx*MAX;
    trx = -ny*MAX;
    tsc = inside ? 1.02 : 1;

    kick();
  });

  document.addEventListener('pointerleave',()=>{
    trx=try_=0;
    tsc=1;
    kick();
  });

} else {
  document.addEventListener('pointermove',e=>{
    const c = $('card');
    const r = c.getBoundingClientRect();

    c.style.setProperty('--mx',e.clientX-r.left+'px');
    c.style.setProperty('--my',e.clientY-r.top+'px');
  });
}

/* PARTICLES */

(function(){
  if(CONFIG.particles==='none') return;

  const cv = $('fx');
  const ctx = cv.getContext('2d');

  const snow = CONFIG.particles==='snow';

  let W,H,P=[];

  const dpr = Math.min(devicePixelRatio||1,2);

  const size = ()=>{
    W=innerWidth;
    H=innerHeight;

    cv.width=W*dpr;
    cv.height=H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);
  };

  size();
  addEventListener('resize',size);

  const n = innerWidth<600 ? 35 : 60;

  for(let i=0;i<n;i++) {
    P.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.6+.5,
      s:Math.random()*.5+.15,
      d:Math.random()*6.28
    });
  }

  function frame() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(180,255,160,.9)';

    for(const p of P) {
      p.d+=.012;

      if(!RM) {
        if(snow) {
          p.y+=p.s;
          p.x+=Math.sin(p.d)*.35;

          if(p.y>H+5) {
            p.y=-5;
            p.x=Math.random()*W;
          }

        } else {
          p.y-=p.s*.4;
          p.x+=Math.sin(p.d)*.18;

          if(p.y<-5) {
            p.y=H+5;
            p.x=Math.random()*W;
          }
        }
      }

      ctx.globalAlpha =
        snow
          ? .6
          : .2+Math.sin(p.d*2)*.2+.2;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fill();
    }

    ctx.globalAlpha=1;

    if(!RM) requestAnimationFrame(frame);
  }

  frame();
})();

</script>
