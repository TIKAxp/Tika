const ic=n=>B[n]?`<svg viewBox="0 0 24 24" fill="currentColor"><path d="${B[n]}"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${S[n]||S.link}</svg>`;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function copy(txt){navigator.clipboard?.writeText(txt);toast('Đã copy: '+txt)}
/* Badges */
function parseBadge(b){const m=String(b).match(/^<(a)?:([\w~]+):(\d+)>$/);if(m){const ext=m[1]?'gif':'png';return `<span class="bdg"><img src="https://cdn.discordapp.com/emojis/${m[3]}.${ext}?size=48&quality=lossless" alt="${m[2]}" loading="lazy"></span>`}return `<span class="bdg">${b}</span>`}
$('badges').innerHTML=(CONFIG.badges||[]).map(parseBadge).join('');if(!CONFIG.badges?.length)$('badges').remove();
if(CONFIG.verified)$('vf').innerHTML='<svg class="vf" viewBox="0 0 24 24" aria-label="Verified"><path d="M12 2l2.4 2.2 3.2-.4 1.2 3 2.9 1.5-.9 3.1.9 3.1-2.9 1.5-1.2 3-3.2-.4L12 22l-2.4-2.2-3.2.4-1.2-3-2.9-1.5.9-3.1-.9-3.1 2.9-1.5 1.2-3 3.2.4Z" fill="var(--accent)"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#0b0b10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const un=$('un');if(CONFIG.username){un.textContent='@'+CONFIG.username+(CONFIG.showId&&CONFIG.discordId?'  ·  ID '+CONFIG.discordId:'');un.onclick=()=>copy(CONFIG.username)}else un.remove();
$('meta').innerHTML=`<span>${ic('pin')}${CONFIG.location.replace(/^📍\s*/, '')}</span>`+(CONFIG.showTime?`<span>${ic('clock')}<b id="time" style="font-weight:500"></b></span>`:'')+`<span>${ic('eye')}<b id="views" style="font-weight:500">0</b></span>`;
$('links').innerHTML=CONFIG.links.map((l,i)=>{const note=l.note||'@'+(l.url.split('/').filter(Boolean).pop()||'').replace(/^@/,'');return `<a class="rv" href="${l.url}" target="_blank" rel="noopener" data-i="${i}" style="--b:${COL[l.icon]||'var(--accent)'}"><span class="ib">${ic(l.icon)}</span><span class="tx"><b>${l.label}</b><small>${note}</small></span></a>`}).join('');
document.querySelectorAll('.links a').forEach(a=>{const l=CONFIG.links[a.dataset.i];a.addEventListener('pointermove',e=>{const r=a.getBoundingClientRect();a.style.setProperty('--lx',e.clientX-r.left+'px');a.style.setProperty('--ly',e.clientY-r.top+'px')});a.addEventListener('pointerdown',e=>{const r=a.getBoundingClientRect(),s=document.createElement('i');s.className='rip';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';a.appendChild(s);setTimeout(()=>s.remove(),650)});if(l.copy)a.addEventListener('click',e=>{e.preventDefault();copy(l.copy)})});
document.querySelectorAll('.rv').forEach((e,i)=>e.style.setProperty('--i',i));
/* Background image/video is opt-in; blank src keeps pure black */
(function(){const v=$('bg'),b=CONFIG.background;if(!b?.src){v.remove();return}if(b.type==='image'){const d=document.createElement('div');d.id='bg';d.style.cssText=`display:block!important;position:fixed;inset:0;z-index:-6;background:url("${b.src}") center/cover;opacity:.25`;v.replaceWith(d)}else v.src=b.src})();
/* Typewriter */
(function(){const el=$('typed'),L=CONFIG.typed||[];if(!L.length){el.remove();return}if(RM){el.textContent=L[0];return}let i=0,j=0,del=false;function tick(){const s=L[i];el.textContent=s.slice(0,j);if(!del&&j===s.length){del=true;return setTimeout(tick,1800)}if(del&&j===0){del=false;i=(i+1)%L.length}j+=del?-1:1;setTimeout(tick,del?28:55)}tick()})();
/* Local time */
if(CONFIG.showTime){const tick=()=>{try{$('time').textContent=new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit',timeZone:CONFIG.timezone}).format(new Date())}catch{$('time').textContent='--:--'}};tick();setInterval(tick,15000)}
/* Music */
const audio=$('audio'),player=$('player');if(CONFIG.music.src)audio.src=CONFIG.music.src;audio.volume=+$('vol').value;$('track').textContent=CONFIG.music.title;
const sync=()=>{$('play').innerHTML=ic(audio.paused?'play':'pause');$('mute').innerHTML=ic(audio.muted||audio.volume===0?'mute':'vol');player.classList.toggle('playing',!audio.paused)};sync();
$('play').onclick=()=>{if(!CONFIG.music.src)return toast('Chưa cấu hình nhạc');audio.paused?audio.play().catch(()=>{}):audio.pause()};$('mute').onclick=()=>{audio.muted=!audio.muted;sync()};$('vol').oninput=e=>{audio.volume=e.target.value;audio.muted=false;sync()};audio.addEventListener('play',sync);audio.addEventListener('pause',sync);
/* Splash */
$('splash').addEventListener('click',()=>{$('splash').classList.add('hide');document.body.classList.add('go');if(CONFIG.music.src)audio.play().catch(()=>{})});
/* View counter */
(async function(){const el=$('views');try{const d=await(await fetch(`https://api.counterapi.dev/v1/${CONFIG.counterKey}/views/up`)).json();el.textContent=Number(d.count).toLocaleString('vi-VN')}catch{const n=(+localStorage.getItem('v')||0)+1;localStorage.setItem('v',n);el.textContent=n}})();
/* Discord live status via Lanyard */
(function connect(){if(!CONFIG.discordId)return;const dot=$('status'),box=$('presence');function render(d){dot.className='st '+d.discord_status;const act=(d.activities||[]).find(a=>a.type!==4);if(d.listening_to_spotify&&d.spotify){$('pimg').src=d.spotify.album_art_url;$('ptitle').textContent=d.spotify.song;$('psub').textContent='Spotify · '+d.spotify.artist;box.classList.add('on')}else if(act){const img=act.assets&&act.assets.large_image;$('pimg').src=img?(img.startsWith('mp:external')?'https://'+img.split('/https/')[1]:`https://cdn.discordapp.com/app-assets/${act.application_id}/${img}.png`):'https://cdn.discordapp.com/embed/avatars/0.png';$('ptitle').textContent=act.name;$('psub').textContent=act.details||act.state||'Đang chơi';box.classList.add('on')}else box.classList.remove('on');if(d.discord_user&&d.discord_user.avatar&&CONFIG.avatar.includes('dicebear'))$('avatar').src=`https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png?size=256`}
try{const ws=new WebSocket(CONFIG.lanyardWs);let hb;ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.op===1){ws.send(JSON.stringify({op:2,d:{subscribe_to_id:CONFIG.discordId}}));hb=setInterval(()=>ws.send(JSON.stringify({op:3})),m.d.heartbeat_interval)}if(m.op===0)render(m.d)};ws.onclose=()=>{clearInterval(hb);setTimeout(connect,5000)}}catch{}})();
/* Mouse light + 3D tilt */
if(FINE&&!RM){const c=$('card'),deep=[[c.querySelector('.av'),.9],[c.querySelector('.nm'),.5]],MAX=CONFIG.tiltMax??14,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let rx=0,ry=0,sc=1,trx=0,try_=0,tsc=1,run=false;function loop(){rx+=(trx-rx)*.1;ry+=(try_-ry)*.1;sc+=(tsc-sc)*.1;c.style.transform=`perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(4)})`;c.style.setProperty('--sx',(-ry*1.6).toFixed(1));c.style.setProperty('--sy',(rx*1.6).toFixed(1));deep.forEach(([el,k])=>el&&(el.style.translate=`${(ry*k).toFixed(1)}px ${(-rx*k).toFixed(1)}px`));if(Math.abs(trx-rx)+Math.abs(try_-ry)+Math.abs(tsc-sc)>.002)requestAnimationFrame(loop);else run=false}const kick=()=>{if(!run){run=true;requestAnimationFrame(loop)}};document.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();root.setProperty('--px',(e.clientX/innerWidth-.5).toFixed(3));root.setProperty('--py',(e.clientY/innerHeight-.5).toFixed(3));root.setProperty('--cx',e.clientX+'px');root.setProperty('--cy',e.clientY+'px');c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px');if(!CONFIG.tilt)return;const nx=clamp((e.clientX-r.left-r.width/2)/(r.width*.65),-1,1),ny=clamp((e.clientY-r.top-r.height/2)/(r.height*.65),-1,1),inside=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;try_=nx*MAX;trx=-ny*MAX;tsc=inside?1.02:1;kick()});document.addEventListener('pointerleave',()=>{trx=try_=0;tsc=1;kick()})}else{document.addEventListener('pointermove',e=>{$('card').style.setProperty('--mx',e.clientX-$('card').getBoundingClientRect().left+'px');$('card').style.setProperty('--my',e.clientY-$('card').getBoundingClientRect().top+'px')})}
/* Particles */
(function(){if(CONFIG.particles==='none')return;const cv=$('fx'),ctx=cv.getContext('2d'),snow=CONFIG.particles==='snow';let W,H,P=[];const dpr=Math.min(devicePixelRatio||1,2);const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener('resize',size);const n=innerWidth<600?35:60;for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.5,s:Math.random()*.5+.15,d:Math.random()*6.28});function frame(){ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(180,255,160,.9)';for(const p of P){p.d+=.012;if(!RM){if(snow){p.y+=p.s;p.x+=Math.sin(p.d)*.35;if(p.y>H+5){p.y=-5;p.x=Math.random()*W}}else{p.y-=p.s*.4;p.x+=Math.sin(p.d)*.18;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}}}ctx.globalAlpha=snow?.6:.2+Math.sin(p.d*2)*.2+.2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;if(!RM)requestAnimationFrame(frame)}frame()})();
</script>
